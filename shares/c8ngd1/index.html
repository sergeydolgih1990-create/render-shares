<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подборка — Lobaro</title>
<style>
  :root { --bg:#FAF6EC; --surface:#FFFFFF; --surface2:#F1E9D6; --border:#E3D6B8; --text:#2B2318; --text-dim:#8A7A5C; --accent:#A9762E; --accent-strong:#7C5620; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",sans-serif; padding:32px 20px 60px; }
  h1 { font-size:20px; font-weight:600; margin:0 0 24px; text-align:center; color:var(--text); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; max-width:1100px; margin:0 auto; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; cursor:pointer;
    transition:box-shadow .15s, border-color .15s; }
  .card:hover { border-color:var(--accent); box-shadow:0 4px 14px rgba(90,70,30,0.12); }
  .card img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--surface2); }
  .card .title { padding:10px 14px 4px; font-size:13.5px; color:var(--text); }
  .card .dl { display:inline-block; margin:2px 14px 12px; background:var(--accent); color:#fff; text-decoration:none;
    font-size:12px; font-weight:600; padding:6px 12px; border-radius:7px; }
  .card .dl:hover { background:var(--accent-strong); }

  .lightbox { position:fixed; inset:0; background:rgba(20,15,8,0.92); display:none; align-items:center; justify-content:center; padding:24px; z-index:100; }
  .lightbox.open { display:flex; }
  .lb-panel { position:relative; background:var(--surface); border-radius:14px; max-width:900px; width:100%; max-height:92vh;
    overflow:hidden; display:flex; flex-direction:column; }
  .lb-img { background:#1a1710; display:flex; align-items:center; justify-content:center; cursor:zoom-in; flex:1; min-height:0; }
  .lb-img img { max-width:100%; max-height:78vh; object-fit:contain; }
  .lb-bottom { padding:14px 20px; display:flex; align-items:center; gap:14px; border-top:1px solid var(--border); }
  .lb-title { flex:1; font-size:14px; }
  .lb-download { background:var(--accent); color:#fff; text-decoration:none; font-size:13px; font-weight:600; padding:8px 14px; border-radius:8px; }
  .lb-download:hover { background:var(--accent-strong); }
  .lb-close { position:absolute; top:12px; right:14px; background:rgba(0,0,0,0.45); color:#fff; border:none;
    width:32px; height:32px; border-radius:50%; font-size:15px; cursor:pointer; z-index:2; }
  .lb-nav { position:absolute; top:38%; transform:translateY(-50%); background:rgba(0,0,0,0.4); color:#fff; border:none;
    width:38px; height:38px; border-radius:50%; font-size:17px; cursor:pointer; z-index:2; }
  .lb-prev { left:12px; } .lb-next { right:12px; }
  .lb-hint { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,0.55); font-size:11px; z-index:2; }

  .zoom-overlay { position:fixed; inset:0; background:rgba(10,8,4,0.97); display:none; align-items:center; justify-content:center; z-index:200; cursor:zoom-out; }
  .zoom-overlay.open { display:flex; }
  .zoom-overlay img { max-width:100vw; max-height:100vh; object-fit:contain; }
</style>
</head>
<body>
<h1>Lobaro — подборка вариантов</h1>
<div class="grid" id="grid"></div>

<div class="lightbox" id="lightbox">
  <div class="lb-panel">
    <button class="lb-close" id="lbClose">✕</button>
    <button class="lb-nav lb-prev" id="lbPrev">‹</button>
    <button class="lb-nav lb-next" id="lbNext">›</button>
    <div class="lb-img"><img id="lbImg" src="" alt=""><span class="lb-hint">двойной клик — на весь экран</span></div>
    <div class="lb-bottom">
      <div class="lb-title" id="lbTitle"></div>
      <a class="lb-download" id="lbDownload" download>⬇ Скачать</a>
    </div>
  </div>
</div>
<div class="zoom-overlay" id="zoomOverlay"><img id="zoomImg" src="" alt=""></div>

const grid = document.getElementById('grid');
grid.innerHTML = DATA.map((d,i) => `
  <div class="card" data-i="${i}">
    <img loading="lazy" src="${d.src}" alt="">
    <div class="title">${d.title}</div>
    <a class="dl" href="${d.src}" download="${d.name}">⬇ Скачать</a>
  </div>`).join('');

grid.addEventListener('click', (e) => {
  if (e.target.closest('.dl')) return;
  const card = e.target.closest('.card');
  if (card) openLightbox(Number(card.dataset.i));
});

const lightbox = document.getElementById('lightbox');
let idx = -1;
function openLightbox(i) { idx = i; showLightbox(); }
function showLightbox() {
  const d = DATA[idx];
  document.getElementById('lbImg').src = d.src;
  document.getElementById('lbTitle').textContent = d.title;
  const dl = document.getElementById('lbDownload');
  dl.href = d.src; dl.download = d.name;
  lightbox.classList.add('open');
}
document.getElementById('lbClose').addEventListener('click', () => lightbox.classList.remove('open'));
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) lightbox.classList.remove('open'); });
document.getElementById('lbPrev').addEventListener('click', () => { idx = (idx - 1 + DATA.length) % DATA.length; showLightbox(); });
document.getElementById('lbNext').addEventListener('click', () => { idx = (idx + 1) % DATA.length; showLightbox(); });
document.addEventListener('keydown', (e) => {
  const zoomOpen = document.getElementById('zoomOverlay').classList.contains('open');
  if (zoomOpen && e.key === 'Escape') { closeZoom(); return; }
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') lightbox.classList.remove('open');
  if (e.key === 'ArrowRight') { idx = (idx + 1) % DATA.length; showLightbox(); }
  if (e.key === 'ArrowLeft') { idx = (idx - 1 + DATA.length) % DATA.length; showLightbox(); }
});

const zoomOverlay = document.getElementById('zoomOverlay');
const zoomImg = document.getElementById('zoomImg');
document.getElementById('lbImg').addEventListener('dblclick', () => {
  zoomImg.src = document.getElementById('lbImg').src;
  zoomOverlay.classList.add('open');
});
function closeZoom() { zoomOverlay.classList.remove('open'); }
zoomOverlay.addEventListener('click', closeZoom);
zoomOverlay.addEventListener('dblclick', closeZoom);
</script>
